# =============================================================================
# examples/inventory-custom-subnet.ini
# Ejemplo si tu VMnet usa otra subred (p.ej. 10.10.50.0/24 por conflicto con
# VirtualBox). Copia esto sobre ansible/inventory.ini y ajusta también
# nyxcore_dc_ip / veloran_dc_ip en ansible/group_vars/all.yml.
# =============================================================================
[domain_controllers]
NYX-DC01 ansible_host=10.10.50.10
VEL-DC01 ansible_host=10.10.50.20

[nyxcore_dcs]
NYX-DC01

[veloran_dcs]
VEL-DC01

[ca_servers]
NYX-CA01 ansible_host=10.10.50.11

[file_servers]
NYX-FS01 ansible_host=10.10.50.12

[jump_hosts]
NYX-JUMP ansible_host=10.10.50.13

[nyxcore_members]
NYX-CA01
NYX-FS01
NYX-JUMP

[windows:children]
domain_controllers
ca_servers
file_servers
jump_hosts

[nyxcore:children]
nyxcore_dcs
nyxcore_members

[veloran:children]
veloran_dcs

[windows:vars]
ansible_connection=winrm
ansible_port=5985
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
ansible_winrm_scheme=http
ansible_winrm_operation_timeout_sec=100
ansible_winrm_read_timeout_sec=120
