# =============================================================================
# inventory.ini — Inventario de ejemplo del laboratorio.
#
#  * Ajusta las IPs si tu VMnet usa otra subred.
#  * Las credenciales viven en group_vars/all.yml (ansible_user/ansible_password).
#  * Conexión WinRM/HTTP (5985) con NTLM. SOLO LAB.
# =============================================================================

[domain_controllers]
NYX-DC01 ansible_host=192.168.56.10
VEL-DC01 ansible_host=192.168.56.20

[nyxcore_dcs]
NYX-DC01 ansible_host=192.168.56.10

[veloran_dcs]
VEL-DC01 ansible_host=192.168.56.20

[ca_servers]
NYX-CA01 ansible_host=192.168.56.11

[file_servers]
NYX-FS01 ansible_host=192.168.56.12

[jump_hosts]
NYX-JUMP ansible_host=192.168.56.13

# Miembros de nyxcore.lab que se unen al dominio (no son DC)
[nyxcore_members]
NYX-CA01
NYX-FS01
NYX-JUMP

# Grupo paraguas con TODAS las máquinas Windows
[windows:children]
domain_controllers
ca_servers
file_servers
jump_hosts

# -----------------------------------------------------------------------------
# Variables de conexión comunes a todas las máquinas Windows.
# Las credenciales (ansible_user / ansible_password) están en group_vars/all.yml
# para poder cifrarlas con ansible-vault más adelante.
# -----------------------------------------------------------------------------
[windows:vars]
ansible_connection=winrm
ansible_port=5985
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
ansible_winrm_scheme=http
# Operaciones de AD (promoción, ADCS) pueden tardar: timeouts amplios.
# read_timeout_sec debe ser mayor que operation_timeout_sec.
ansible_winrm_operation_timeout_sec=100
ansible_winrm_read_timeout_sec=120

# -----------------------------------------------------------------------------
# Agrupación por dominio (carga group_vars/nyxcore.yml y group_vars/veloran.yml)
# -----------------------------------------------------------------------------
[nyxcore:children]
nyxcore_dcs
nyxcore_members

[veloran:children]
veloran_dcs
