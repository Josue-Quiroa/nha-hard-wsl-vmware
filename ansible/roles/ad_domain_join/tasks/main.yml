---
# ad_domain_join — Une NYX-CA01, NYX-FS01 y NYX-JUMP a nyxcore.lab.

- name: "Apuntar DNS al DC de nyxcore ({{ join_dns_server }})"
  ansible.windows.win_dns_client:
    adapter_names: "*"
    dns_servers:
      - "{{ join_dns_server }}"

- name: "Verificar que el dominio resuelve antes de unir"
  ansible.windows.win_shell: |
    Clear-DnsClientCache
    Resolve-DnsName -Name '{{ join_domain_fqdn }}' -ErrorAction Stop | Out-Null
  register: dns_ok
  until: dns_ok.rc == 0
  retries: 6
  delay: 10
  changed_when: false

- name: "Unir {{ inventory_hostname }} a {{ join_domain_fqdn }}"
  microsoft.ad.membership:
    dns_domain_name: "{{ join_domain_fqdn }}"
    hostname: "{{ inventory_hostname }}"
    domain_admin_user: "{{ join_admin_user }}"
    domain_admin_password: "{{ join_admin_password }}"
    state: domain
    reboot: true

- name: "Comprobar pertenencia al dominio"
  ansible.windows.win_shell: (Get-CimInstance Win32_ComputerSystem).Domain
  register: joined
  changed_when: false

- name: "Mostrar dominio"
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} -> {{ joined.stdout | trim }}"
