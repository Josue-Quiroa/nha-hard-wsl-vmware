# =============================================================================
# ansible.cfg — configuración del nodo de control para el lab AD (WinRM).
# Ejecuta Ansible desde este directorio (ansible/) para que se cargue.
# =============================================================================
[defaults]
inventory            = inventory.ini
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
# Salida legible en YAML (ansible-core >= 2.13)
stdout_callback      = default
callback_result_format = yaml
forks                = 5
# Timeout de conexión (s). Los timeouts de WinRM están en inventory.ini
timeout              = 60
interpreter_python   = auto_silent
deprecation_warnings = False
nocows               = 1
log_path             = logs/ansible.log

[persistent_connection]
connect_timeout = 60
command_timeout = 90
